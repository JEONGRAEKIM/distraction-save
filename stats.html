<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기록 보기 | Distraction Save</title>
  <link rel="stylesheet" href="stats.css">
  <script src="chart.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Distraction Save 기록</h1>
      <p class="subtitle">얼마나 멈췄는지보다, 얼마나 다시 돌아왔는지에 집중합니다.</p>
    </header>

    <div class="summary-grid">
      <div class="summary-card accent">
        <div class="summary-value" id="total-points">0</div>
        <div class="summary-label">누적 포인트</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="total-awareness">0</div>
        <div class="summary-label">전체 멈춤</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="total-alt">0</div>
        <div class="summary-label">되돌아가기</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="total-quiet">0</div>
        <div class="summary-label">1분 쉬기</div>
      </div>
    </div>

    <section class="chart-section">
      <h2>최근 7일 멈춤 흐름 <span class="unit">(회)</span></h2>
      <div class="chart-wrapper">
        <canvas id="weekly-chart"></canvas>
      </div>
    </section>

    <section class="pattern-section">
      <h2>자주 흔들리는 시간대 <span class="unit">(전체 기준)</span></h2>
      <div id="hourly-pattern"></div>
    </section>

    <section class="history-section">
      <h2>최근 기록</h2>
      <ul id="history-list">
        <li class="empty">아직 기록이 없어요.</li>
      </ul>
    </section>
  </div>

  <script src="stats.js"></script>
</body>
</html>
