<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distraction Save</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <span class="logo">DS</span>
      <div class="header-text">
        <h1>Distraction Save</h1>
        <p id="status-text">보호 모드 켜짐</p>
      </div>
      <label class="toggle">
        <input type="checkbox" id="main-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="stats-grid">
      <div class="stat-card accent">
        <div class="stat-value" id="today-points">0</div>
        <div class="stat-label">오늘 포인트</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="today-awareness">0</div>
        <div class="stat-label">오늘 멈춘 횟수</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="today-saved-time">0</div>
        <div class="stat-label">지켜낸 시간(분)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="today-breaks">0</div>
        <div class="stat-label">1분 쉬기</div>
      </div>
    </div>

    <div class="section">
      <label class="section-label" for="today-task-input">오늘 기억할 일</label>
      <input
        type="text"
        id="today-task-input"
        class="task-input"
        placeholder="예: 보고서 마무리, 운동 다녀오기"
        maxlength="60"
      >
      <p class="section-help">유튜브 홈 Freedom Room에 바로 표시됩니다.</p>
    </div>

    <div class="section">
      <span class="section-label">읽을 책</span>
      <button id="book-btn" class="book-btn" type="button">
        <span id="book-btn-title">책 등록하기</span>
        <span class="book-btn-arrow">→</span>
      </button>
      <p class="section-help">유튜브를 누르면 지난번 읽던 곳이 바로 열립니다.</p>
    </div>

    <div class="section">
      <label class="section-label" for="gemini-key-input">Gemini API 키</label>
      <input
        type="password"
        id="gemini-key-input"
        class="task-input"
        placeholder="API 키를 입력하세요"
        maxlength="200"
        autocomplete="off"
      >
      <p class="section-help" id="gemini-key-status">키를 입력하면 기도/응원 기능이 활성화됩니다.</p>
    </div>

    <div class="footer">
      <button id="stats-btn">기록 보기</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
